name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      api: ${{ steps.filter.outputs.api }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'Makefile'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'Makefile'
            e2e:
              - 'apps/mobile/**'
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'Makefile'

  static-analysis:
    name: Static Analysis (Lint & Types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Node Modules & Bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
          key: ${{ runner.os }}-turbo-static-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-static-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: make install-ci

      - name: Check Formatting
        run: make check-format

      - name: Lint & Typecheck
        run: make check-static

  unit-tests:
    name: Unit Tests & Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Node Modules & Bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
          key: ${{ runner.os }}-turbo-tests-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-tests-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: make install-ci

      - name: Run Unit Tests
        run: make check-tests

      - name: Run Expo Doctor
        run: make check-doctor

  e2e-browser:
    name: Playwright Browser E2E Tests
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Node Modules & Bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - name: Install dependencies
        run: make install-ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: make playwright-install

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: make playwright-install-deps

      - name: Run Playwright Browser E2E Tests
        run: make check-e2e-browser

  validate:
    name: CI Quality Gate
    needs: [changes, static-analysis, unit-tests, e2e-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Validation Results
        run: |
          echo "Changes Detection: ${{ needs.changes.result }}"
          echo "Static Analysis:   ${{ needs.static-analysis.result }}"
          echo "Unit Tests:        ${{ needs.unit-tests.result }}"
          echo "E2E Browser:       ${{ needs.e2e-browser.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Changes detection failed"
            exit 1
          fi

          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "::error::Static Analysis failed"
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::Unit Tests failed"
            exit 1
          fi

          if [ "${{ needs.e2e-browser.result }}" != "success" ] && [ "${{ needs.e2e-browser.result }}" != "skipped" ]; then
            echo "::error::E2E Browser Tests failed"
            exit 1
          fi

          echo "All validation checks passed successfully."
