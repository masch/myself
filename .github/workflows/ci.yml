name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      target:
        description: "Component to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mobile
          - api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      api: ${{ steps.filter.outputs.api }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'Makefile'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'Makefile'
            e2e:
              - 'apps/mobile/**'
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'Makefile'

  static-analysis:
    name: Static Analysis (Lint & Types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turborepo & Bun
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
            ~/.bun/install/cache
          key: ${{ runner.os }}-turbo-static-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-static-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: make check-format

      - name: Lint & Typecheck
        run: make check-static

  unit-tests:
    name: Unit Tests & Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turborepo & Bun
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
            ~/.bun/install/cache
          key: ${{ runner.os }}-turbo-tests-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-tests-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: make check-tests

      - name: Run Expo Doctor
        run: make check-doctor

  e2e-browser:
    name: Playwright Browser E2E Tests
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turborepo & Bun
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
            ~/.bun/install/cache
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright Browser E2E Tests
        run: make check-e2e-browser

  validate:
    name: Lint, Typecheck & Test
    needs: [changes, static-analysis, unit-tests, e2e-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Validation Results
        run: |
          echo "Static Analysis: ${{ needs.static-analysis.result }}"
          echo "Unit Tests:      ${{ needs.unit-tests.result }}"
          echo "E2E Browser:     ${{ needs.e2e-browser.result }}"

          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "::error::Static Analysis failed"
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::Unit Tests failed"
            exit 1
          fi

          if [ "${{ needs.e2e-browser.result }}" != "success" ] && [ "${{ needs.e2e-browser.result }}" != "skipped" ]; then
            echo "::error::E2E Browser Tests failed"
            exit 1
          fi

          echo "All validation checks passed successfully."

  deploy_mobile_staging:
    name: "Staging: Deploy Mobile Web (EAS)"
    needs: [changes, validate]
    environment: staging
    if: |
      always() && needs.validate.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.mobile == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && (inputs.target == 'all' || inputs.target == 'mobile'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache Node Modules & Bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Staging to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: ${{ env.EXPO_TOKEN != '' }}
        run: make stg-mobile-deploy

  deploy_api_staging:
    name: "Staging: Deploy API (Cloudflare)"
    needs: [changes, validate]
    environment: staging
    if: |
      always() && needs.validate.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && (inputs.target == 'all' || inputs.target == 'api'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Node Modules & Bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Staging Database Migrations
        env:
          ENVIRONMENT: staging
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        if: ${{ env.TURSO_DATABASE_URL != '' && env.TURSO_AUTH_TOKEN != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: make api-db-migrate-remote

      - name: Seed Staging Database
        env:
          ENVIRONMENT: staging
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        if: ${{ env.TURSO_DATABASE_URL != '' && env.TURSO_AUTH_TOKEN != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: make api-db-seed-remote

      - name: Deploy Staging to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: make stg-api-deploy

  deploy_mobile_production:
    name: "Production: Deploy Mobile Web (EAS)"
    needs: [changes, validate]
    environment: production
    if: |
      always() && needs.validate.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'production' &&
      (inputs.target == 'all' || inputs.target == 'mobile')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache Node Modules & Bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Production to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: ${{ env.EXPO_TOKEN != '' }}
        run: make prd-mobile-deploy

  deploy_api_production:
    name: "Production: Deploy API (Cloudflare)"
    needs: [changes, validate]
    environment: production
    if: |
      always() && needs.validate.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'production' &&
      (inputs.target == 'all' || inputs.target == 'api')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Node Modules & Bun
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Production Database Migrations
        env:
          ENVIRONMENT: production
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        if: ${{ env.TURSO_DATABASE_URL != '' && env.TURSO_AUTH_TOKEN != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: make api-db-migrate-remote

      - name: Seed Production Database
        env:
          ENVIRONMENT: production
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        if: ${{ env.TURSO_DATABASE_URL != '' && env.TURSO_AUTH_TOKEN != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: make api-db-seed-remote

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: make prd-api-deploy
