name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  validate_and_build:
    name: Lint, Typecheck & Export
    type: generic
    runs_on: ubuntu-latest
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Quality Checks & Web Export
        run: |
          make check
          make export-web
